# Card Desk Drops: where data comes from.
#
# Every entry here was verified live in Phase 0 (see SOURCES.md and docs/phase0/).
# Ship-to flags come from a one-off manual cart check. The app never adds to cart; it only
# watches each Shopify shop's /meta.json country list and flags a change for re-verification.

version: 1
user_agent: 'CardDeskDrops/0.1 (personal release tracker)'

sources:
  - id: collectosk
    label: collectosk release calendar
    adapter: collectosk
    role: calendar
    enabled: true
    categories: [football, f1]
    urls:
      - https://www.collectosk.com/wp-json/wp/v2/pages?slug=new-release-calendar&_fields=id,modified_gmt,link,content
    cadence_minutes: 1440
    crawl_delay_seconds: 2
    max_confidence: confirmed_date
    precedence: 2
    notes: Primary sports calendar. Covers Europe-only Topps releases. RSS is disallowed by robots.txt.

  - id: checklistinsider
    label: Checklist Insider release calendar
    adapter: checklistinsider
    role: calendar
    enabled: true
    categories: [football, f1]
    urls: [https://www.checklistinsider.com/release-calendar]
    cadence_minutes: 1440
    crawl_delay_seconds: 2
    max_confidence: confirmed_date
    precedence: 3
    notes: US-centric cross-check. No conditional GET.

  - id: press-pokemon-na
    label: Pokémon press site (schedule)
    adapter: press-pokemon-na
    role: calendar
    enabled: true
    categories: [pokemon]
    urls: [https://press.pokemon.com/en/Items/Schedule/Pokemon-Trading-Card-Game?types=3]
    cadence_minutes: 1440
    crawl_delay_seconds: 5
    max_confidence: confirmed_date
    precedence: 1
    notes: Official. Set names and release dates. robots.txt Crawl-Delay 5.

  - id: press-pokemon-eu
    label: Pokémon EU press site
    adapter: press-pokemon-eu
    role: calendar
    enabled: true
    categories: [pokemon]
    urls: [https://pokemon.gamespress.com/en-GB/]
    cadence_minutes: 1440
    crawl_delay_seconds: 5
    max_confidence: confirmed_date
    precedence: 1
    notes: Official UK/EU dates and prereleases.

  - id: pc-zendesk
    label: Pokémon Center pre-order dates article
    adapter: pc-zendesk
    role: signal
    enabled: true
    categories: [pokemon]
    urls: [https://support.pokemoncenter.com/api/v2/help_center/en-us/articles/4407702295572.json]
    cadence_minutes: 1440
    crawl_delay_seconds: 2
    max_confidence: announced
    precedence: 2
    notes: Lineup and ship-window signal only. Pokémon Center UK ships to UK addresses only.

  - id: serebii
    label: Serebii English set list
    adapter: serebii
    role: calendar
    enabled: true
    categories: [pokemon]
    urls: [https://www.serebii.net/card/english.shtml]
    cadence_minutes: 1440
    crawl_delay_seconds: 2
    max_confidence: announced
    precedence: 3
    notes: Secondary cross-check.

  - id: ecb-fx
    label: ECB euro reference rates
    adapter: ecb-fx
    role: reference
    enabled: true
    categories: []
    urls: [https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml]
    cadence_minutes: 1440
    crawl_delay_seconds: 0
    max_confidence: rumoured
    precedence: 9
    notes: Daily GBP/EUR/USD conversion.

  - id: cardmarket
    label: Cardmarket price guide (Pokémon sealed)
    adapter: cardmarket-import
    role: market
    enabled: true
    categories: [pokemon]
    urls:
      - https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json
      - https://downloads.s3.cardmarket.com/productCatalog/productList/products_nonsingles_6.json
    cadence_minutes: 1440
    crawl_delay_seconds: 0
    max_confidence: rumoured
    precedence: 9
    notes: >-
      EU market prices in EUR (sold-based avg/trend, cheapest listing). The 16 MB file is too big
      for a Free-plan Worker, so .github/workflows/cardmarket.yml pre-filters it daily and posts
      the sealed boxes to the public Worker. Public data, free to use (Cardmarket, July 2025).

